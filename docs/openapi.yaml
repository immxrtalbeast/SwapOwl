      security: [{demoToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hours]
              properties: {hours: {type: number, exclusiveMinimum: 0, maximum: 720}}
            example: {hours: 6}
      responses:
        '200': {description: Применено}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
