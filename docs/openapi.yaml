  /api/demo/reset:
    post:
      tags: [demo]
      summary: Сброс стенда к демо-данным
      description: "Требует `Authorization: Bearer <DEMO_TOKEN>`. Тело и Content-Type не нужны: `curl -X POST -H \"Authorization: Bearer $DEMO_TOKEN\" https://swapowl.duckdns.org/api/demo/reset`."
      security: [{demoToken: []}]
      responses:
        '200': {description: Сброс выполнен}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/demo/simulator:
    post:
      tags: [demo]
      summary: Запустить или поставить на паузу генератор заказов (DEMO_TOKEN)
      description: "Требует `Authorization: Bearer <DEMO_TOKEN>`."
