            example: {running: true}
      responses:
        '200': {description: Применено}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/demo/burst:
    post:
      tags: [demo]
      summary: Параллельные заказы по одной порции блюда (DEMO_TOKEN)
      description: "Требует `Authorization: Bearer <DEMO_TOKEN>`."
      security: [{demoToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dish_id, orders]
              properties:
                dish_id: {type: string}
                orders: {type: integer, minimum: 1, maximum: 50}
            example: {dish_id: salmon-pasta, orders: 10}
      responses:
        '200': {description: Результат серии}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/auth/login:
    post:
      tags: [access]
      summary: Вход по логину и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties: {login: {type: string}, password: {type: string}}
            example: {login: admin, password: s3cret}
      responses:
        '200':
          description: Вход выполнен; cookie `session` (HttpOnly, SameSite=Strict, Secure)
          content:
            application/json:
              schema:
                type: object
                properties: {login: {type: string}, role: {$ref: '#/components/schemas/Role'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429':
          description: "`too_many_attempts` — больше 5 неудач на login за 15 минут"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/auth/logout:
    post:
      tags: [access]
      summary: Выход (viewer)
      responses:
        '204': {description: Сессия удалена}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/auth/me:
    get:
      tags: [access]
      summary: Текущий пользователь (viewer)
      responses:
        '200':
          description: При `AUTH_REQUIRED=false` без учётных данных — `login=null`, `role=operator`
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: {type: [string, 'null']}
                  role: {$ref: '#/components/schemas/Role'}
                  auth_required: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/auth/password:
    post:
      tags: [access]
      summary: Сменить свой пароль (viewer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old, new]
              properties: {old: {type: string}, new: {type: string}}
      responses:
        '200': {description: Пароль изменён}
        '204': {description: Пароль изменён}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/users:
    get:
      tags: [access]
      summary: Пользователи (admin)
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: {type: array, items: {type: object, additionalProperties: true}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [access]
      summary: Создать пользователя (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password, role]
              properties: {login: {type: string}, password: {type: string}, role: {$ref: '#/components/schemas/Role'}}
            example: {login: chef, password: s3cret-pass, role: operator}
      responses:
        '201': {description: Создан}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Логин занят
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/users/{id}:
    delete:
      tags: [access]
      summary: Удалить пользователя (admin)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Удалён}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Последнего admin удалить нельзя
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/api-keys:
    get:
      tags: [access]
      summary: Ключи интеграций (admin)
      responses:
        '200':
          description: Список (без секретов)
          content:
            application/json:
              schema: {type: array, items: {type: object, additionalProperties: true}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [access]
      summary: Создать ключ (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties: {name: {type: string}, role: {$ref: '#/components/schemas/Role'}}
            example: {name: iiko-adapter, role: operator}
      responses:
        '201':
          description: Создан; поле `key` показывается один раз
          content:
            application/json:
              schema:
                type: object
                properties: {key: {type: string}}
                additionalProperties: true
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/api-keys/{id}:
    delete:
      tags: [access]
      summary: Удалить ключ (admin)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: Удалён}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/audit:
    get:
      tags: [access]
      summary: Журнал действий, новые сверху (admin)
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Записи
          content:
            application/json:
              schema: {type: array, items: {type: object, additionalProperties: true}}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: session}
    bearer: {type: http, scheme: bearer, description: Ключ интеграции из /api/api-keys}
    demoToken: {type: http, scheme: bearer, description: Значение DEMO_TOKEN}
    metricsToken: {type: http, scheme: bearer, description: Значение METRICS_TOKEN}
  parameters:
    From:
      name: from
      in: query
      description: Дата `YYYY-MM-DD` (сутки по поясу ресторана) или момент RFC 3339; по умолчанию — 7 суток до `to`
      schema: {type: string}
    To:
      name: to
      in: query
      description: Дата `YYYY-MM-DD` (включительно) или момент RFC 3339; по умолчанию — «сейчас»
      schema: {type: string}
  responses:
    Validation:
      description: "`validation_error`, `unknown_product` или `unknown_dish`"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: validation_error
              message: quantity must be a string
              details: {field: "items[0].quantity"}
    Unauthorized:
      description: "`unauthorized` — нет действительной сессии, ключа или токена"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: "`forbidden` — роли недостаточно"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: "`not_found`"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Overloaded:
      description: "`overloaded` — БД недоступна"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: |
                400: validation_error, unknown_product, unknown_dish; 401: unauthorized; 403: forbidden;
                404: not_found, unknown_batch, unknown_order; 405: method_not_allowed;
                409: delivery_conflict, order_conflict, insufficient_stock, unit_conflict, correction_conflict,
                insufficient_batch, order_not_cancellable, already_cancelled; 429: too_many_attempts;
                500: internal; 503: overloaded.
            message: {type: string}
            details: {type: object, additionalProperties: true}
    Unit:
      type: string
      enum: [g, kg, ml, l, pcs]
    Role:
      type: string
      enum: [viewer, operator, admin]
    Qty:
      description: Количество в ответах — целое в базовых единицах (g, ml, pcs)
      type: object
      required: [qty, unit]
      properties:
        qty: {type: integer, format: int64}
        unit: {type: string, enum: [g, ml, pcs]}
      example: {qty: 1500, unit: g}
    QtyInput:
      description: Количество на входе — только JSON-строка; JSON-число (`400`) отклоняется
      type: string
      pattern: '^[0-9]+(\.[0-9]+)?$'
      example: '0.15'
    Clock:
      type: object
      properties:
        now: {type: string, format: date-time}
        speed: {type: number}
        timezone: {type: string}
        simulated: {type: boolean}
        simulator_running: {type: boolean}
    DeliveryRequest:
      type: object
      required: [id, items]
      properties:
        id: {type: string, description: Уникальный id от поставщика}
        number: {type: string}
        created_at: {type: string, format: date-time}
        occurred_at: {type: string, format: date-time}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: {type: string}
              name: {type: string}
              quantity: {$ref: '#/components/schemas/QtyInput'}
              unit:
                description: Единица ввода. `pack` — целое число упаковок, только у продукта с `pack_unit`; в базовых единицах это число × `pack_size`.
                type: string
                enum: [g, kg, ml, l, pcs, pack]
              shelf_life_hours: {type: integer, minimum: 1, maximum: 87600}
              expires_on: {type: string, format: date}
    DeliveryResponse:
      type: object
      properties:
        id: {type: string}
        number: {type: string}
        created_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        replayed: {type: boolean}
        batches:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              line_no: {type: integer}
              product_id: {type: string}
              quantity: {$ref: '#/components/schemas/Qty'}
              received_at: {type: string, format: date-time}
              expires_at: {type: string, format: date-time}
              status: {type: string, enum: [ok, expiring, expired]}
        warnings:
          type: array
          items:
            type: object
            properties:
              line_no: {type: integer}
              code: {type: string, examples: [expired_on_arrival]}
              message: {type: string}
    ProductStock:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        unit: {type: string}
        available: {$ref: '#/components/schemas/Qty'}
        expiring: {$ref: '#/components/schemas/Qty'}
        batches_count: {type: integer}
        nearest_expires_at: {type: [string, 'null'], format: date-time}
        shelf_after_open_hours:
          type: [integer, 'null']
          description: Срок после вскрытия упаковки, ч; null — вскрытие срок не меняет
    Batch:
      type: object
      properties:
        id: {type: integer}
        product_id: {type: string}
        delivery_id: {type: string}
        delivery_created_at: {type: string, format: date-time}
        quantity: {$ref: '#/components/schemas/Qty'}
        remaining: {$ref: '#/components/schemas/Qty'}
        received_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        time_left_seconds: {type: integer}
        status: {type: string, enum: [ok, expiring, expired]}
        parent_batch_id:
          type: [integer, 'null']
          description: Исходная партия, если эта выделена вскрытием упаковки
        opened_at:
          type: [string, 'null']
          format: date-time
          description: Момент вскрытия; маркировка «вскрыто …»
    Alert:
      type: object
      properties:
        batch_id: {type: integer}
        product_id: {type: string}
        product_name: {type: string}
        remaining: {$ref: '#/components/schemas/Qty'}
        expires_at: {type: string, format: date-time}
        time_left_seconds: {type: integer}
        status: {type: string, enum: [expiring, expired]}
        doomed: {type: boolean}
    SupplySuggestion:
      type: object
      properties:
        product_id: {type: string}
        product_name: {type: string}
        quantity: {$ref: '#/components/schemas/Qty'}
        usable_stock: {$ref: '#/components/schemas/Qty'}
        rate_per_day: {$ref: '#/components/schemas/Qty'}
        stockout_at: {type: [string, 'null'], format: date-time}
        blocks_dishes: {type: integer}
        urgency: {type: string, enum: [now, soon, planned]}
        explanation: {type: string}
    SupplyOrder:
      type: object
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [sent, delivered, error]
          description: sent — в очереди; delivered — адаптер подтвердил доставку в iiko; error — последняя попытка не удалась, адаптер повторит
        created_at: {type: string, format: date-time}
        items:
          type: array
          items:
            type: object
            properties:
              product_id: {type: string}
              product_name: {type: string}
              qty: {type: integer}
              unit: {type: string, enum: [g, ml, pcs]}
        attempts: {type: integer}
        last_error: {type: [string, 'null']}
        replayed: {type: boolean}
    DishAvailability:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        available: {type: boolean}
        servings: {type: integer}
        missing:
          type: array
          items:
            type: object
            properties:
              product_id: {type: string}
              product_name: {type: string}
              required: {$ref: '#/components/schemas/Qty'}
              available: {$ref: '#/components/schemas/Qty'}
              missing: {$ref: '#/components/schemas/Qty'}
        recipe:
          type: array
          items:
            type: object
            properties:
              product_id: {type: string}
              quantity: {$ref: '#/components/schemas/Qty'}
    HotOffers:
      type: object
      properties:
        algo: {type: string, enum: [a, b]}
        offers:
          type: array
          items:
            type: object
            properties:
              dish_id: {type: string}
              dish_name: {type: string}
              priority: {type: number}
              target_portions: {type: integer, description: У алгоритма `a` равен 0}
              target_today: {type: integer, description: "Сколько из цели продать до закрытия сегодня: ceil(target × min(W_today, W(now, срок)) / W(now, срок)); ≤ target_portions"}
              usual_portions: {type: integer}
              sell_until: {type: string, format: date-time}
              reasons:
                type: array
                items:
                  type: object
                  properties:
                    product_id: {type: string}
                    product_name: {type: string}
                    batch_id: {type: integer}
                    at_risk: {$ref: '#/components/schemas/Qty'}
                    expires_at: {type: string, format: date-time}
                    working_hours_left: {type: number}
              explanation: {type: string}
        excluded:
          type: array
          items:
            type: object
            properties:
              dish_id: {type: string}
              product_id: {type: string}
              why: {type: string}
    OrderRequest:
      type: object
      required: [id, items]
      properties:
        id: {type: string, format: uuid}
        source: {type: string, enum: [api, pos], default: api}
        occurred_at: {type: string, format: date-time}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [dish_id, portions]
            properties:
              dish_id: {type: string}
              portions: {type: integer, minimum: 1, maximum: 10000}
    OrderResponse:
      type: object
      properties:
        id: {type: string}
        source: {type: string, enum: [api, pos]}
        status: {type: string, enum: [accepted, rejected]}
        at: {type: string, format: date-time}
        replayed: {type: boolean}
        writeoffs:
          type: array
          items:
            type: object
            properties:
              product_id: {type: string}
              product_name: {type: string}
              batch_id: {type: integer}
              qty: {$ref: '#/components/schemas/Qty'}
              expires_at: {type: string, format: date-time}
        shortfalls:
          type: array
          items:
            type: object
            properties:
              product_id: {type: string}
              product_name: {type: string}
              quantity: {$ref: '#/components/schemas/Qty'}
    CorrectionLine:
      type: object
      properties:
        batch_id: {type: integer}
        product_id: {type: string}
        qty: {$ref: '#/components/schemas/Qty'}
    CatalogRequest:
      type: object
      properties:
        products:
          type: array
          items:
            type: object
            required: [id, name, unit, price_minor_per_1000, lead_days, pack_size]
            properties:
              id: {type: string}
              name: {type: string}
              unit: {type: string, enum: [g, ml, pcs]}
              price_minor_per_1000: {type: integer, minimum: 0}
              lead_days: {type: integer}
              pack_size: {type: integer}
              shelf_life_hours: {type: integer, minimum: 1, maximum: 87600}
              shelf_after_open_hours: {type: integer, minimum: 1, maximum: 87600, description: Срок после вскрытия упаковки, ч; не передан — прежний сохраняется}
              piece_weight:
                type: integer
                minimum: 1
                description: g или ml в одной штуке; только при `unit: pcs`. Норма техкарты в g/kg/ml/l пересчитывается в штуки с округлением вверх на порцию (docs/catalog.md).
              piece_weight_unit: {type: string, enum: [g, ml], default: g}
              pack_unit:
                type: string
                maxLength: 32
                description: Метка упаковки («уп»). С ней `pack_size` — содержимое упаковки в базовых единицах, а позиции поставки можно вводить с `unit: pack`.
        dishes:
          type: array
          items:
            type: object
            required: [id, name, price_minor, prior_daily, recipe]
            properties:
              id: {type: string}
              name: {type: string}
              price_minor: {type: integer}
              prior_daily: {type: number}
              recipe:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [product_id, quantity]
                  properties:
                    product_id: {type: string}
                    quantity: {$ref: '#/components/schemas/QtyInput'}
                    unit: {$ref: '#/components/schemas/Unit'}
    CatalogAction:
      type: object
      properties:
        id: {type: string}
        action: {type: string, enum: [created, updated, unchanged]}
        fields: {type: array, items: {type: string}}
