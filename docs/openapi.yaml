              example:
                {available: true, runs: 200, main_algo: b, waste_reduction_vs_random_pct: 39.0, waste_reduction_vs_nearest_pct: 27.0}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/demo/clock/speed:
    post:
      tags: [demo]
