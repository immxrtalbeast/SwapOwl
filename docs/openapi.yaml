openapi: 3.1.0
info:
  title: Мониторинг остатков, сроков годности и стоп-листов
  version: 1.0.0
  description: |
    HTTP JSON API и SSE-поток событий. Источник контракта — `.ai/solution.md` (7.4, 7.5), человекочитаемое
    описание — `docs/api.md`. Множество маршрутов сверяется с роутером тестом `TestOpenAPIMatchesRouter`
    (`internal/api/openapi_test.go`): новый маршрут без описания в `paths` валит тест.

    Общее:
    * Каждый ответ несёт заголовки `X-Stand-Time` (RFC 3339, время стенда) и `X-Request-Id`.
    * Изменяющие запросы — только с `Content-Type: application/json`.
    * Количество в ответах — `{"qty": 1500, "unit": "g"}`; на входе — JSON-строка `"0.15"` и `unit` ∈ g, kg, ml, l, pcs.
    * Роли: `viewer` < `operator` < `admin`. Сессия — cookie `session`; интеграции — `Authorization: Bearer <ключ>`.
      При `AUTH_REQUIRED=false` запрос без учётных данных работает с ролью `operator`.
    * Маршруты склада, заказов и т. д. регистрируются, только если подключена соответствующая зависимость;
      `/api/demo/*` при `DEMO_MODE=false` отвечают 404.
servers:
  - url: https://swapowl.duckdns.org
    description: Стенд
  - url: http://localhost:8080
    description: Локально
tags:
  - {name: service, description: Служебные}
  - {name: stock, description: Поставки, склад, мониторинг}
  - {name: orders, description: Заказы и корректировки}
  - {name: menu, description: Меню, стоп-лист, горячие предложения, поставки}
  - {name: analytics, description: Аналитика}
  - {name: access, description: Вход, пользователи, ключи, журнал}
  - {name: demo, description: Управление стендом}
  - {name: integration, description: Справочники и очередь для адаптера}
security:
  - session: []
  - bearer: []
paths:
  /api/openapi.yaml:
    get:
      tags: [service]
      summary: Описание API (этот файл)
      security: []
      responses:
        '200':
          description: OpenAPI 3.1
          content:
            application/yaml:
              schema: {type: string}
  /api/docs:
    get:
      tags: [service]
      summary: Страница документации по описанию API
      security: []
      responses:
        '200':
          description: HTML
          content:
            text/html:
              schema: {type: string}
  /healthz:
    get:
      tags: [service]
      summary: Проверка живости (БД доступна, миграции применены)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string, const: ok}}}
              example: {status: ok}
        '503': {$ref: '#/components/responses/Overloaded'}
  /metrics:
    get:
      tags: [service]
      summary: Метрики в текстовом формате Prometheus
      description: "Требует `Authorization: Bearer <METRICS_TOKEN>`. Без токена в конфиге или с неверным — `404` (ручка скрыта)."
      security: [{metricsToken: []}]
      responses:
        '200':
          description: Метрики
          content:
            text/plain:
              schema: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
  /events:
    get:
      tags: [service]
      summary: Поток событий SSE (viewer)
      description: |
        `event: <тип>`, `data: <JSON>`, `id: <номер>`; каждое событие содержит `at`. События — сигналы «перечитай».
        Клиент при (пере)подключении перечитывает данные; сервер шлёт `ping` каждые 15 с.
        Типы: `delivery.accepted`, `order.accepted`, `order.rejected`, `batch.expiring`, `batch.expired`,
        `stock.changed`, `stoplist.changed`, `hotoffers.changed`, `clock.changed`, `stand.reset`.
      responses:
        '200':
          description: Поток `text/event-stream`
          content:
            text/event-stream:
              schema: {type: string}
              example: |
                event: order.accepted
                id: 128
                data: {"at":"2026-10-09T12:00:00+03:00","order_id":"5b0c0c3e-8a51-4d0e-9d0b-1f2a3b4c5d6e","product_ids":["salmon","pasta"]}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/clock:
    get:
      tags: [demo]
      summary: Часы стенда (открыт всем)
      security: []
      responses:
        '200':
          description: Состояние часов
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Clock'}
  /api/deliveries:
    post:
      tags: [stock]
      summary: Принять поставку (operator)
      description: |
        Идемпотентна по `id`. В позиции не больше одного из `shelf_life_hours` (1…87600) и `expires_on`;
        без обоих берётся срок по умолчанию у продукта, иначе `400`. `occurred_at` — фактическое время прихода
        (окно `LATE_EVENTS_HOURS`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeliveryRequest'}
            example:
              id: D-2026-0042
              number: '42'
              created_at: '2026-10-09T08:00:00+03:00'
              items:
                - {product_id: salmon, name: Лосось, quantity: '4', unit: kg, shelf_life_hours: 72}
                - {product_id: cream, name: Сливки, quantity: '600', unit: ml, expires_on: '2026-10-12'}
      responses:
        '201':
          description: Принята
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryResponse'}
              example:
                id: D-2026-0042
                number: '42'
                created_at: '2026-10-09T08:00:00+03:00'
                received_at: '2026-10-09T09:00:00+03:00'
                replayed: false
                batches:
                  - {id: 17, line_no: 1, product_id: salmon, quantity: {qty: 4000, unit: g},
                     received_at: '2026-10-09T09:00:00+03:00', expires_at: '2026-10-12T09:00:00+03:00', status: ok}
                warnings: []
        '200':
          description: Тот же id и то же содержимое — сохранённый ответ с `replayed=true`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryResponse'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: "`delivery_conflict` — тот же id, другое содержимое"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    get:
      tags: [stock]
      summary: История поставок, новые сверху (viewer)
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DeliveryResponse'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/deliveries/{id}:
    get:
      tags: [stock]
      summary: Одна поставка (viewer)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, example: D-2026-0042}
      responses:
        '200':
          description: Поставка
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/products:
    get:
      tags: [stock]
      summary: Продукты с остатками (viewer)
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ProductStock'}}
              example:
                - {id: salmon, name: Лосось, unit: g, available: {qty: 4000, unit: g}, expiring: {qty: 1400, unit: g},
                   batches_count: 2, nearest_expires_at: '2026-10-10T18:00:00+03:00'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/batches:
    get:
      tags: [stock]
      summary: Партии (viewer)
      description: По умолчанию без списанных в ноль, порядок `(expires_at, id)`.
      parameters:
        - {name: product_id, in: query, schema: {type: string}, example: salmon}
        - {name: status, in: query, schema: {type: string, enum: [ok, expiring, expired]}}
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Batch'}}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/batches/{id}/open:
    post:
      tags: [stock]
      summary: Вскрыть упаковку — выделить из партии часть с коротким сроком (operator)
      description: |
        Срок на упаковке — для закрытой; после вскрытия действует свой срок продукта `shelf_after_open_hours`
        (молоко и сливки 48 ч, пармезан 120 ч). Из исходной партии уходит `qty` движением `transfer_out` / `opened`,
        создаётся дочерняя партия (`parent_batch_id`, `opened_at = now`) с остатком `qty`, сроком
        `min(исходный срок, now + shelf_after_open_hours)` и движением `transfer_in` / `opened`.
        Одна транзакция под блокировкой продукта. Идемпотентна по `id`: тот же `id` и тело — `200`, `replayed: true`;
        другое тело — `409 correction_conflict`. Баланс партий — docs/opened.md.

        `qty` не передан: одна упаковка (`pack_size` продукта при `pack_size > 1`, но не больше остатка),
        иначе вся партия.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string, minLength: 1, maxLength: 128}
                qty: {$ref: '#/components/schemas/QtyInput'}
                unit: {$ref: '#/components/schemas/Unit'}
            example: {id: open-001, qty: '1', unit: l}
      responses:
        '201':
          description: Упаковка вскрыта
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  parent_batch_id: {type: integer}
                  product_id: {type: string}
                  opened: {$ref: '#/components/schemas/Qty'}
                  parent_remaining: {$ref: '#/components/schemas/Qty'}
                  child:
                    type: object
                    description: Дочерняя партия
                    properties:
                      id: {type: integer}
                      product_id: {type: string}
                      quantity: {$ref: '#/components/schemas/Qty'}
                      received_at: {type: string, format: date-time}
                      expires_at: {type: string, format: date-time}
                      status: {type: string}
                  opened_at: {type: string, format: date-time}
                  shelf_after_open_hours: {type: integer}
                  replayed: {type: boolean}
        '200': {description: Повтор операции (`replayed=true`)}
        '400':
          description: "`validation_error`: `qty` больше остатка, не той размерности или не положительное; у продукта нет `shelf_after_open_hours` («вскрытие не меняет срок»)"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: "`batch_closed` (партия просрочена или пуста) или `correction_conflict`"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/alerts:
    get:
      tags: [stock]
      summary: Истекающие партии и просроченные за последние 24 ч стенда (viewer)
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Alert'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/movements:
    get:
      tags: [stock]
      summary: Журнал движений, новые первыми (viewer)
      parameters:
        - {name: product_id, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string, enum: [receipt, sale, writeoff, return, adjustment, transfer_in, transfer_out]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Список движений
          content:
            application/json:
              schema: {type: array, items: {type: object, additionalProperties: true}}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/supply-suggestions:
    get:
      tags: [menu]
      summary: Предложение поставок (viewer)
      description: Порядок — `blocks_dishes > 0` первыми, затем по `stockout_at`, затем по id.
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SupplySuggestion'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/supply-orders:
    post:
      tags: [menu]
      summary: Заказ поставщику в iiko одной кнопкой — кладётся в outbox (operator)
      description: |
        Сообщение `supply_order` попадает в outbox той же транзакцией; адаптер доставляет в iiko документ
        «Заказ поставщику» и подтверждает доставку. `id` — UUID от клиента, идемпотентность по нему:
        повтор с тем же составом — `200` и тот же заказ, другой состав — `409 order_conflict`.
        Количество — целое в базовой единице продукта (`g`, `ml`, `pcs`), 1…10^12.
        В теневом режиме адаптера заказ в iiko не уходит, а пишется в его журнал.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, items]
              properties:
                id: {type: string, format: uuid}
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [product_id, qty]
                    properties:
                      product_id: {type: string}
                      qty: {type: integer, minimum: 1, maximum: 1000000000000}
            example:
              id: 5b0c0c3e-8a51-4d0e-9d0b-1f2a3b4c5d6e
              items: [{product_id: salmon, qty: 4000}]
      responses:
        '201':
          description: Заказ принят и поставлен в очередь
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupplyOrder'}
        '200':
          description: Повтор того же id и состава — тот же заказ, `replayed=true`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupplyOrder'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Тот же id, другой состав (`order_conflict`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/supply-orders/{id}:
    get:
      tags: [menu]
      summary: Статус заказа поставщику по подтверждению outbox (viewer)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Заказ и статус
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupplyOrder'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/dishes:
    get:
      tags: [menu]
      summary: Блюда с доступностью и порциями (viewer)
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DishAvailability'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/stop-list:
    get:
      tags: [menu]
      summary: Стоп-лист — блюда с `available=false` (viewer)
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DishAvailability'}}
              example:
                - id: salmon-pasta
                  name: Паста с лососем
                  available: false
                  servings: 0
                  missing:
                    - {product_id: salmon, product_name: Лосось, required: {qty: 150, unit: g},
                       available: {qty: 0, unit: g}, missing: {qty: 150, unit: g}}
                  recipe: [{product_id: salmon, quantity: {qty: 150, unit: g}}]
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/forecast/writeoffs:
    get:
      tags: [menu]
      summary: Прогноз списаний «если ничего не делать» (viewer)
      parameters:
        - {name: hours, in: query, description: Горизонт в часах, по умолчанию 168, schema: {type: integer, enum: [24, 72, 168]}}
      responses:
        '200':
          description: Деньги под риском по партиям со сроком раньше now+hours (количество под риском 2.6, без горячих предложений)
          content:
            application/json:
              example:
                hours: 168
                total_minor: 126000
                products:
                  - {product_id: salmon, product_name: Лосось, at_risk: {qty: 1400, unit: g}, total_minor: 126000}
                days:
                  - {date: '2026-10-09', total_minor: 126000}
                generated_at: '2026-10-09T11:00:00+03:00'
  /api/hot-offers:
    get:
      tags: [menu]
      summary: Горячие предложения (viewer)
      parameters:
        - {name: algo, in: query, description: По умолчанию из `HOTOFFERS_ALGO`, schema: {type: string, enum: [a, b]}}
      responses:
        '200':
          description: Предложения и исключённые блюда
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HotOffers'}
              example:
                algo: b
                offers:
                  - dish_id: salmon-steak
                    dish_name: Стейк из лосося
                    priority: 412.5
                    target_portions: 7
                    usual_portions: 3
                    sell_until: '2026-10-09T16:00:00+03:00'
                    reasons:
                      - {product_id: salmon, product_name: Лосось, batch_id: 17, at_risk: {qty: 1400, unit: g},
                         expires_at: '2026-10-09T16:00:00+03:00', working_hours_left: 5.0}
                    explanation: 'Лосось, партия №17: 1,4 кг не успеет разойтись за 5 рабочих часов. 7 порций спасут весь остаток.'
                excluded:
                  - {dish_id: caprese, product_id: tomato, why: Помидоров осталось на 5 рабочих часов}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/orders:
    post:
      tags: [orders]
      summary: Создать заказ (operator)
      description: |
        `id` — UUID от клиента. `source`: `api` (по умолчанию; всё или ничего) или `pos` (продажа из кассы:
        недостача пишется в `shortfalls`, отказа нет). Повтор с тем же id и телом — `200`/`409` с `replayed=true`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderRequest'}
            example:
              id: 5b0c0c3e-8a51-4d0e-9d0b-1f2a3b4c5d6e
              items: [{dish_id: salmon-pasta, portions: 2}]
      responses:
        '201':
          description: Принят
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
              example:
                id: 5b0c0c3e-8a51-4d0e-9d0b-1f2a3b4c5d6e
                source: api
                status: accepted
                at: '2026-10-09T12:00:00+03:00'
                replayed: false
                writeoffs: [{product_id: salmon, batch_id: 17, qty: {qty: 300, unit: g}, expires_at: '2026-10-12T09:00:00+03:00'}]
                shortfalls: []
        '200':
          description: Повтор принятого заказа (`replayed=true`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: |
            `insufficient_stock` (в `details` — `order_id`, `status=rejected`, `at`, `missing`) или `order_conflict`
            (тот же id, другое тело).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: insufficient_stock
                  message: недостаточно продуктов
                  details:
                    order_id: 5b0c0c3e-8a51-4d0e-9d0b-1f2a3b4c5d6e
                    status: rejected
                    at: '2026-10-09T12:00:00+03:00'
                    missing:
                      - {product_id: cream, product_name: Сливки, required: {qty: 400, unit: ml},
                         available: {qty: 100, unit: ml}, missing: {qty: 300, unit: ml}}
    get:
      tags: [orders]
      summary: История заказов (viewer)
      description: |
        Новые сверху. `X-Total-Count` — число заказов с этим статусом целиком (не размер страницы).
        Следующая страница — `before=<id последнего заказа страницы>`.
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [accepted, rejected]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: before, in: query, description: id заказа, после которого продолжить, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Список
          headers:
            X-Total-Count: {description: Число заказов с этим статусом, schema: {type: integer}}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/OrderResponse'}}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/orders/{id}/cancel:
    post:
      tags: [orders]
      summary: Отменить принятый заказ, вернув проданное в партии (operator)
      parameters:
        - {name: id, in: path, required: true, description: Отменяемый заказ, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties: {id: {type: string, minLength: 1, maxLength: 128, description: id операции (идемпотентность)}}
            example: {id: cancel-001}
      responses:
        '201':
          description: Отменён
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  order_id: {type: string}
                  returned: {type: array, items: {$ref: '#/components/schemas/CorrectionLine'}}
                  expired: {type: array, items: {$ref: '#/components/schemas/CorrectionLine'}}
                  at: {type: string, format: date-time}
                  replayed: {type: boolean}
        '200': {description: Повтор операции (`replayed=true`)}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: "`order_not_cancellable`, `already_cancelled` или `correction_conflict`"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/writeoffs:
    post:
      tags: [orders]
      summary: Списать брак с партии (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, batch_id, qty, reason]
              properties:
                id: {type: string, minLength: 1, maxLength: 128}
                batch_id: {type: integer}
                qty: {$ref: '#/components/schemas/QtyInput'}
                unit: {$ref: '#/components/schemas/Unit'}
                reason: {type: string, enum: [spoilage, damage]}
            example: {id: wo-001, batch_id: 17, qty: '1.5', unit: kg, reason: spoilage}
      responses:
        '201':
          description: Списано
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  batch_id: {type: integer}
                  product_id: {type: string}
                  qty: {$ref: '#/components/schemas/Qty'}
                  reason: {type: string}
                  remaining: {$ref: '#/components/schemas/Qty'}
                  at: {type: string, format: date-time}
                  replayed: {type: boolean}
        '200': {description: Повтор операции (`replayed=true`)}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: "`insufficient_batch` (qty больше остатка партии) или `correction_conflict`"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/inventory:
    post:
      tags: [orders]
      summary: Инвентаризация продукта (operator)
      description: Недостача списывается по FEFO движениями `adjustment`; излишек — новая партия `INV-<id>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, product_id, counted]
              properties:
                id: {type: string, minLength: 1, maxLength: 128}
                product_id: {type: string}
                counted: {$ref: '#/components/schemas/QtyInput'}
                unit: {$ref: '#/components/schemas/Unit'}
            example: {id: inv-001, product_id: salmon, counted: '2.5', unit: kg}
      responses:
        '201':
          description: Применена
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  product_id: {type: string}
                  counted: {$ref: '#/components/schemas/Qty'}
                  shortage: {type: array, items: {$ref: '#/components/schemas/CorrectionLine'}}
                  surplus: {type: [object, 'null'], additionalProperties: true}
                  at: {type: string, format: date-time}
                  replayed: {type: boolean}
        '200': {description: Повтор операции (`replayed=true`)}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: "`correction_conflict` — тот же id, другое тело"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/catalog:
    put:
      tags: [integration]
      summary: Импорт справочников из учётной системы (admin или ключ operator)
      description: |
        Добавление и обновление без удаления; `recipe` блюда заменяется целиком; одна транзакция.
        Вошедший по паролю `operator` получает `403`.
      parameters:
        - {name: dry_run, in: query, description: Вернуть разницу, ничего не записав, schema: {type: boolean}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogRequest'}
            example:
              products:
                - {id: rice, name: Рис, unit: g, price_minor_per_1000: 15000, lead_days: 2, pack_size: 1000, shelf_life_hours: 720}
              dishes:
                - id: pilaf
                  name: Плов
                  price_minor: 45000
                  prior_daily: 12.5
                  recipe: [{product_id: rice, quantity: '0.15', unit: kg}]
      responses:
        '200':
          description: Результат импорта
          content:
            application/json:
              schema:
                type: object
                properties:
                  dry_run: {type: boolean}
                  products:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogAction'}
                  dishes:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogAction'}
              example:
                dry_run: true
                products: [{id: rice, action: created}]
                dishes: [{id: pilaf, action: updated, fields: [price_minor, recipe]}]
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: "`unit_conflict` — у существующего продукта другая единица (`details.product_id`, `current_unit`, `import_unit`)"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/outbox:
    get:
      tags: [integration]
      summary: Недоставленные сообщения для адаптера, по возрастанию id (operator)
      parameters:
        - {name: after, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer}
                    kind: {type: string}
                    payload: {}
                    created_at: {type: string, format: date-time}
                    attempts: {type: integer}
                    last_error: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/outbox/{id}/ack:
    post:
      tags: [integration]
      summary: Подтвердить доставку или ошибку сообщения (operator)
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              properties:
                ok: {type: boolean}
                error: {type: string, description: Обрезается до 2000 символов}
            example: {ok: false, error: timeout}
      responses:
        '200': {description: Принято}
        '204': {description: Принято}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/analytics/writeoffs:
    get:
      tags: [analytics]
      summary: Списания по продуктам и причинам — количество и стоимость (viewer)
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200':
          description: Отчёт
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/analytics/shortfalls:
    get:
      tags: [analytics]
      summary: Недостачи касс (`source=pos`) — расхождения для сверки склада (viewer)
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200':
          description: Отчёт
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/analytics/shortages:
    get:
      tags: [analytics]
      summary: Продукты по числу отклонённых заказов и недостающему количеству (viewer)
