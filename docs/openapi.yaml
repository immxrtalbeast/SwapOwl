openapi: 3.1.0
info:
  title: Мониторинг остатков, сроков годности и стоп-листов
  version: 1.0.0
  description: |
    HTTP JSON API и SSE-поток событий. Источник контракта — `.ai/solution.md` (7.4, 7.5), человекочитаемое
    описание — `docs/api.md`. Множество маршрутов сверяется с роутером тестом `TestOpenAPIMatchesRouter`
    (`internal/api/openapi_test.go`): новый маршрут без описания в `paths` валит тест.

    Общее:
    * Каждый ответ несёт заголовки `X-Stand-Time` (RFC 3339, время стенда) и `X-Request-Id`.
    * Изменяющие запросы — только с `Content-Type: application/json`.
    * Количество в ответах — `{"qty": 1500, "unit": "g"}`; на входе — JSON-строка `"0.15"` и `unit` ∈ g, kg, ml, l, pcs.
    * Роли: `viewer` < `operator` < `admin`. Сессия — cookie `session`; интеграции — `Authorization: Bearer <ключ>`.
      При `AUTH_REQUIRED=false` запрос без учётных данных работает с ролью `operator`.
    * Маршруты склада, заказов и т. д. регистрируются, только если подключена соответствующая зависимость;
      `/api/demo/*` при `DEMO_MODE=false` отвечают 404.
servers:
  - url: https://swapowl.duckdns.org
    description: Стенд
  - url: http://localhost:8080
    description: Локально
tags:
  - {name: service, description: Служебные}
  - {name: stock, description: Поставки, склад, мониторинг}
  - {name: orders, description: Заказы и корректировки}
  - {name: menu, description: Меню, стоп-лист, горячие предложения, поставки}
  - {name: analytics, description: Аналитика}
  - {name: access, description: Вход, пользователи, ключи, журнал}
  - {name: demo, description: Управление стендом}
  - {name: integration, description: Справочники и очередь для адаптера}
security:
  - session: []
  - bearer: []
paths:
  /api/openapi.yaml:
    get:
      tags: [service]
      summary: Описание API (этот файл)
      security: []
      responses:
        '200':
          description: OpenAPI 3.1
          content:
            application/yaml:
              schema: {type: string}
  /api/docs:
    get:
      tags: [service]
      summary: Страница документации по описанию API
      security: []
      responses:
        '200':
          description: HTML
          content:
            text/html:
              schema: {type: string}
  /healthz:
    get:
      tags: [service]
      summary: Проверка живости (БД доступна, миграции применены)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string, const: ok}}}
              example: {status: ok}
        '503': {$ref: '#/components/responses/Overloaded'}
  /metrics:
    get:
      tags: [service]
      summary: Метрики в текстовом формате Prometheus
      description: "Требует `Authorization: Bearer <METRICS_TOKEN>`. Без токена в конфиге или с неверным — `404` (ручка скрыта)."
      security: [{metricsToken: []}]
      responses:
        '200':
          description: Метрики
          content:
            text/plain:
              schema: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
  /events:
    get:
      tags: [service]
      summary: Поток событий SSE (viewer)
      description: |
        `event: <тип>`, `data: <JSON>`, `id: <номер>`; каждое событие содержит `at`. События — сигналы «перечитай».
        Клиент при (пере)подключении перечитывает данные; сервер шлёт `ping` каждые 15 с.
        Типы: `delivery.accepted`, `order.accepted`, `order.rejected`, `batch.expiring`, `batch.expired`,
        `stock.changed`, `stoplist.changed`, `hotoffers.changed`, `clock.changed`, `stand.reset`.
      responses:
        '200':
          description: Поток `text/event-stream`
          content:
            text/event-stream:
              schema: {type: string}
              example: |
                event: order.accepted
                id: 128
                data: {"at":"2026-10-09T12:00:00+03:00","order_id":"5b0c0c3e-8a51-4d0e-9d0b-1f2a3b4c5d6e","product_ids":["salmon","pasta"]}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/clock:
    get:
      tags: [demo]
      summary: Часы стенда (открыт всем)
      security: []
      responses:
        '200':
          description: Состояние часов
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Clock'}
  /api/deliveries:
    post:
      tags: [stock]
      summary: Принять поставку (operator)
      description: |
        Идемпотентна по `id`. Срок годности обязателен в каждой позиции — ровно одно из `expires_on` («годен до»,
        годен весь этот день по времени ресторана) и `shelf_life_hours` (1…87600): срок даёт поставщик, срока из
        карточки продукта для поставки нет; позиция без срока — `400` с полем `items[i].expires_on`. `occurred_at` — фактическое время прихода
        (окно `LATE_EVENTS_HOURS`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeliveryRequest'}
            example:
              id: D-2026-0042
              number: '42'
              created_at: '2026-10-09T08:00:00+03:00'
              items:
                - {product_id: salmon, name: Лосось, quantity: '4', unit: kg, shelf_life_hours: 72}
                - {product_id: cream, name: Сливки, quantity: '600', unit: ml, expires_on: '2026-10-12'}
      responses:
        '201':
          description: Принята
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryResponse'}
              example:
                id: D-2026-0042
                number: '42'
                created_at: '2026-10-09T08:00:00+03:00'
                received_at: '2026-10-09T09:00:00+03:00'
                replayed: false
                batches:
                  - {id: 17, line_no: 1, product_id: salmon, quantity: {qty: 4000, unit: g},
                     received_at: '2026-10-09T09:00:00+03:00', expires_at: '2026-10-12T09:00:00+03:00', status: ok}
                warnings: []
        '200':
          description: Тот же id и то же содержимое — сохранённый ответ с `replayed=true`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryResponse'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: "`delivery_conflict` — тот же id, другое содержимое"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    get:
      tags: [stock]
      summary: История поставок, новые сверху (viewer)
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DeliveryResponse'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/deliveries/{id}:
    get:
      tags: [stock]
      summary: Одна поставка (viewer)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, example: D-2026-0042}
      responses:
        '200':
          description: Поставка
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/products:
    get:
      tags: [stock]
      summary: Продукты с остатками (viewer)
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ProductStock'}}
              example:
                - {id: salmon, name: Лосось, unit: g, available: {qty: 4000, unit: g}, expiring: {qty: 1400, unit: g},
                   batches_count: 2, nearest_expires_at: '2026-10-10T18:00:00+03:00'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/invoices/recognize:
    post:
      tags: [stock]
      summary: Распознать фото накладной — черновик поставки (operator)
      description: |
        Фото накладной (ТОРГ-12, УПД, счёт, рукописная) → позиции, сопоставленные со справочником. Поставку **не создаёт**:
        оператор проверяет строки (принять, поправить количество — недовоз, отметить брак) и отправляет принятое
        обычным `POST /api/deliveries`. `date` — дата документа, не срок годности; срок — `expires_on` / `shelf_life_hours`
        позиции, если напечатан. `confidence: low` — строку стоит проверить (`note` — что под сомнением).
        Модель — `INVOICE_MODEL` (по умолчанию Claude Haiku 5.5), ключ — `ANTHROPIC_API_KEY`. Без ключа на демо-стенде
        отвечает демо-распознаватель с образцом (`demo: true`), иначе `503 not_configured`. Лимит — `INVOICE_PER_HOUR` в час.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_base64, media_type]
              additionalProperties: false
              properties:
                image_base64: {type: string, description: "Фото в base64 без префикса data:, до 8 МБ"}
                media_type: {type: string, enum: [image/jpeg, image/png, image/webp]}
      responses:
        '200':
          description: Черновик поставки
          content:
            application/json:
              schema:
                type: object
                properties:
                  number: {type: string}
                  date: {type: string}
                  supplier: {type: string}
                  model: {type: string}
                  demo: {type: boolean}
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        raw_name: {type: string}
                        product_id: {type: string, nullable: true}
                        quantity: {type: string, example: "12"}
                        unit: {type: string, enum: [g, kg, ml, l, pcs]}
                        expires_on: {type: string, format: date, nullable: true}
                        shelf_life_hours: {type: integer, nullable: true}
                        confidence: {type: string, enum: [high, low]}
                        note: {type: string}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {description: "`unreadable_invoice` — на фото нет позиций накладной", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: "`too_many_attempts` — лимит распознаваний за час; заголовок Retry-After", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '502': {description: "`internal` — сервис распознавания не ответил", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: "`not_configured` — нет ключа модели", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/batches:
    get:
      tags: [stock]
      summary: Партии (viewer)
      description: По умолчанию без списанных в ноль, порядок `(expires_at, id)`.
      parameters:
        - {name: product_id, in: query, schema: {type: string}, example: salmon}
        - {name: status, in: query, schema: {type: string, enum: [ok, expiring, expired]}}
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Batch'}}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/batches/{id}/open:
    post:
      tags: [stock]
      summary: Вскрыть упаковку — выделить из партии часть с коротким сроком (operator)
      description: |
        Срок на упаковке — для закрытой; после вскрытия действует свой срок продукта `shelf_after_open_hours`
        (молоко и сливки 48 ч, пармезан 120 ч). Из исходной партии уходит `qty` движением `transfer_out` / `opened`,
        создаётся дочерняя партия (`parent_batch_id`, `opened_at = now`) с остатком `qty`, сроком
        `min(исходный срок, now + shelf_after_open_hours)` и движением `transfer_in` / `opened`.
        Одна транзакция под блокировкой продукта. Идемпотентна по `id`: тот же `id` и тело — `200`, `replayed: true`;
        другое тело — `409 correction_conflict`. Баланс партий — docs/opened.md.

        `qty` не передан: одна упаковка (`pack_size` продукта при `pack_size > 1`, но не больше остатка),
        иначе вся партия.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: {type: string, minLength: 1, maxLength: 128}
                qty: {$ref: '#/components/schemas/QtyInput'}
                unit: {$ref: '#/components/schemas/Unit'}
            example: {id: open-001, qty: '1', unit: l}
      responses:
        '201':
          description: Упаковка вскрыта
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  parent_batch_id: {type: integer}
                  product_id: {type: string}
                  opened: {$ref: '#/components/schemas/Qty'}
                  parent_remaining: {$ref: '#/components/schemas/Qty'}
                  child:
                    type: object
                    description: Дочерняя партия
                    properties:
                      id: {type: integer}
                      product_id: {type: string}
                      quantity: {$ref: '#/components/schemas/Qty'}
                      received_at: {type: string, format: date-time}
                      expires_at: {type: string, format: date-time}
                      status: {type: string}
                  opened_at: {type: string, format: date-time}
                  shelf_after_open_hours: {type: integer}
                  replayed: {type: boolean}
        '200': {description: Повтор операции (`replayed=true`)}
        '400':
          description: "`validation_error`: `qty` больше остатка, не той размерности или не положительное; у продукта нет `shelf_after_open_hours` («вскрытие не меняет срок»)"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: "`batch_closed` (партия просрочена или пуста), `already_opened` (партия уже выделена вскрытием — повторно не вскрывается) или `correction_conflict`"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/alerts:
    get:
      tags: [stock]
      summary: Истекающие партии и просроченные за последние 24 ч стенда (viewer)
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Alert'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/movements:
    get:
      tags: [stock]
      summary: Журнал движений, новые первыми (viewer)
      parameters:
        - {name: product_id, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string, enum: [receipt, sale, writeoff, return, adjustment, transfer_in, transfer_out]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Список движений
          content:
            application/json:
              schema: {type: array, items: {type: object, additionalProperties: true}}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/supply-suggestions:
    get:
      tags: [menu]
      summary: Предложение поставок (viewer)
      description: Порядок — `blocks_dishes > 0` первыми, затем по `stockout_at`, затем по id.
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SupplySuggestion'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/supply-orders:
    post:
      tags: [menu]
      summary: Заказ поставщику в iiko одной кнопкой — кладётся в outbox (operator)
      description: |
        Сообщение `supply_order` попадает в outbox той же транзакцией; адаптер доставляет в iiko документ
        «Заказ поставщику» и подтверждает доставку. `id` — UUID от клиента, идемпотентность по нему:
        повтор с тем же составом — `200` и тот же заказ, другой состав — `409 order_conflict`.
        Количество — целое в базовой единице продукта (`g`, `ml`, `pcs`), 1…10^12.
        В теневом режиме адаптера заказ в iiko не уходит, а пишется в его журнал.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, items]
              properties:
                id: {type: string, format: uuid}
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [product_id, qty]
                    properties:
                      product_id: {type: string}
                      qty: {type: integer, minimum: 1, maximum: 1000000000000}
            example:
              id: 5b0c0c3e-8a51-4d0e-9d0b-1f2a3b4c5d6e
              items: [{product_id: salmon, qty: 4000}]
      responses:
        '201':
          description: Заказ принят и поставлен в очередь
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupplyOrder'}
        '200':
          description: Повтор того же id и состава — тот же заказ, `replayed=true`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupplyOrder'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Тот же id, другой состав (`order_conflict`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/supply-orders/{id}:
    get:
      tags: [menu]
      summary: Статус заказа поставщику по подтверждению outbox (viewer)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Заказ и статус
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupplyOrder'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/dishes:
    get:
      tags: [menu]
      summary: Блюда с доступностью и порциями (viewer)
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DishAvailability'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/stop-list:
    get:
      tags: [menu]
      summary: Стоп-лист — блюда с `available=false` (viewer)
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DishAvailability'}}
              example:
                - id: salmon-pasta
                  name: Паста с лососем
                  available: false
                  servings: 0
                  missing:
                    - {product_id: salmon, product_name: Лосось, required: {qty: 150, unit: g},
                       available: {qty: 0, unit: g}, missing: {qty: 150, unit: g}}
                  recipe: [{product_id: salmon, quantity: {qty: 150, unit: g}}]
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/forecast/writeoffs:
    get:
      tags: [menu]
      summary: Прогноз списаний «если ничего не делать» (viewer)
      parameters:
        - {name: hours, in: query, description: Горизонт в часах, по умолчанию 168, schema: {type: integer, enum: [24, 72, 168]}}
      responses:
        '200':
          description: Деньги под риском по партиям со сроком раньше now+hours (количество под риском 2.6, без горячих предложений)
          content:
            application/json:
              example:
                hours: 168
                total_minor: 126000
                products:
                  - {product_id: salmon, product_name: Лосось, at_risk: {qty: 1400, unit: g}, total_minor: 126000}
                days:
                  - {date: '2026-10-09', total_minor: 126000}
                generated_at: '2026-10-09T11:00:00+03:00'
  /api/what-if:
    post:
      tags: [menu]
      summary: «Что если»: пересчёт списаний по сценариям (viewer, ничего не пишет)
      description: |
        Считает на копии снимка склада прогноз списаний по сроку на `horizon_days` суток для базы («если ничего не делать»,
        как `GET /api/forecast/writeoffs`) и для каждого сценария отдельно. До 5 сценариев, горизонт 1…7 суток.
        Расчёт детерминирован (случайности нет): тот же снимок и тело дают тот же ответ. Таймаут расчёта 5 с, иначе `503 overloaded`.
        Типы: `discount` (`dish_id`, `percent` 5…50; спрос растёт в `1 + 1,5·percent/100` раза — допущение), `order_less`
        (`product_id`, `percent` 10…100; из остатка убирается доля, сначала самые свежие партии), `demand` (`dish_id`, `factor` 0.5…2).
        Допущения каждого сценария возвращаются словами в `assumptions`. Ошибки валидации — `400 validation_error` с `details.field`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [horizon_days]
              additionalProperties: false
              properties:
                horizon_days: {type: integer, minimum: 1, maximum: 7}
                scenarios:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [type]
                    additionalProperties: false
                    properties:
                      type: {type: string, enum: [discount, order_less, demand]}
                      dish_id: {type: string, description: Для discount и demand}
                      product_id: {type: string, description: Для order_less}
                      percent: {type: number, description: "discount: 5…50; order_less: 10…100"}
                      factor: {type: number, minimum: 0.5, maximum: 2, description: Для demand}
            example:
              horizon_days: 3
              scenarios:
                - {type: discount, dish_id: steak, percent: 20}
                - {type: order_less, product_id: salmon, percent: 50}
      responses:
        '200':
          description: База и сценарии в порядке запроса; суммы в копейках, `delta_pct` — к базе, %
          content:
            application/json:
              example:
                horizon_days: 3
                base:
                  total_minor: 36000
                  products:
                    - {product_id: salmon, product_name: Лосось, base_minor: 36000, scenario_minor: 36000, delta_minor: 0}
                scenarios:
                  - type: discount
                    dish_id: steak
                    percent: 20
                    total_minor: 9000
                    delta_minor: -27000
                    delta_pct: -75
                    products:
                      - {product_id: salmon, product_name: Лосось, base_minor: 36000, scenario_minor: 9000, delta_minor: -27000}
                    assumptions:
                      - Скидка 20% на «Стейк из лосося» поднимает спрос в 1,3 раза (эластичность 1,5 — допущение, не измерение).
                      - 'Цена и выручка в расчёте не участвуют: считаются только списания по сроку.'
                generated_at: '2026-10-10T10:00:00Z'
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503':
          description: Расчёт не уложился в 5 с (`overloaded`, в `message` — что уменьшить)
  /api/assistant/ask:
    post:
      tags: [menu]
      summary: Помощник — ответ на вопрос своими словами (viewer, ничего не пишет)
      description: |
        Разбор по правилам, без модели: тот же вопрос на тех же данных даёт тот же ответ. Понимает «что в стопе»,
        «что истекает», «что заказать», «что предложить гостям», «сколько осталось лосося», «можно ли приготовить пасту»,
        «сколько денег под риском», «сколько списали за неделю» (периоды: сегодня, вчера, за неделю, за месяц, за N дней),
        «что делать с лососем», «на чём заработаем», «насколько точен прогноз». Если источник темы не подключён —
        честный ответ «эти данные сейчас недоступны».
        Данные — те же, что на экранах склада, стоп-листа, поставок и горячих предложений. Непонятый вопрос —
        `intent: unknown` и подсказки. Вопрос 1…300 символов, иначе `400 validation_error` с `details.field: question`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              additionalProperties: false
              properties:
                question: {type: string, minLength: 1, maxLength: 300}
            example: {question: Что в стопе?}
      responses:
        '200':
          description: Намерение и готовый текст ответа
          content:
            application/json:
              schema:
                type: object
                required: [intent, answer]
                properties:
                  intent: {type: string, enum: [help, stop, expiring, order, hot, plan, product, dish, money, ladder, margin, accuracy, unknown]}
                  answer: {type: string}
              example:
                intent: stop
                answer: "В стоп-листе 1:\n• Крем-суп — не хватает «сливки» (нужно 50 мл, есть 0 мл)"
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/hot-offers:
    get:
      tags: [menu]
      summary: Горячие предложения (viewer)
      parameters:
        - {name: algo, in: query, description: По умолчанию из `HOTOFFERS_ALGO`, schema: {type: string, enum: [a, b]}}
      responses:
        '200':
          description: Предложения и исключённые блюда
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HotOffers'}
              example:
                algo: b
                offers:
                  - dish_id: salmon-steak
                    dish_name: Стейк из лосося
                    priority: 412.5
                    target_portions: 7
                    usual_portions: 3
                    sell_until: '2026-10-09T16:00:00+03:00'
                    reasons:
                      - {product_id: salmon, product_name: Лосось, batch_id: 17, at_risk: {qty: 1400, unit: g},
                         expires_at: '2026-10-09T16:00:00+03:00', working_hours_left: 5.0}
                    explanation: 'Лосось, партия №17: 1,4 кг не успеет разойтись за 5 рабочих часов. 7 порций спасут весь остаток.'
                excluded:
                  - {dish_id: caprese, product_id: tomato, why: Помидоров осталось на 5 рабочих часов}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/public/rescue:
    get:
      tags: [menu]
      summary: Витрина «Спаси продукты» (без входа, `PUBLIC_RESCUE=true`)
      description: >
        Блюда со скидкой из горячих предложений без стоп-листа и скрытых менеджером. Не больше 50 строк,
        лимит 60 запросов в минуту с адреса, `Cache-Control: public, max-age=15`. При выключенной настройке — 404.
      responses:
        '200':
          description: Список блюд со скидкой
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  type: object
                  required: [dish_id, dish_name, servings_left, discount_percent, valid_until, note]
                  properties:
                    dish_id: {type: string}
                    dish_name: {type: string}
                    servings_left: {type: integer}
                    discount_percent: {type: integer, minimum: 5, maximum: 50}
                    valid_until: {type: string, format: date-time}
                    note: {type: string}
              example:
                - {dish_id: salmon-steak, dish_name: Стейк из лосося, servings_left: 4, discount_percent: 20,
                   valid_until: '2026-10-09T16:00:00+03:00', note: Скидка на блюдо дня}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {description: Слишком много запросов}
  /api/public/menu:
    get:
      tags: [menu]
      summary: Меню гостя со стоп-листом (без входа, `PUBLIC_RESCUE=true`)
      description: >
        Для гостя: название блюда и статус — `available` (можно заказать), `few` (осталось до трёх порций),
        `stopped` (нет в наличии). Рецептов, причин стопа, остатков и партий в ответе нет. Включается тем же
        `PUBLIC_RESCUE`, что и витрина «Спаси продукты»; при выключенной настройке — 404. Лимит 60 запросов в минуту
        с адреса, `Cache-Control: public, max-age=15`.
      responses:
        '200':
          description: Все блюда меню со статусом
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [dish_id, dish_name, status]
                  properties:
                    dish_id: {type: string}
                    dish_name: {type: string}
                    status: {type: string, enum: [available, few, stopped]}
              example:
                - {dish_id: steak, dish_name: Стейк из лосося, status: available}
                - {dish_id: soup, dish_name: Крем-суп, status: stopped}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {description: Слишком много запросов}
  /api/rescue-ladder:
    get:
      tags: [menu]
      summary: Лестница спасения партии — что сделать с каждой партией под риском и сколько это не даст списать (viewer)
      description: |
        Для каждой истекающей партии с остатком: ступень `sell` (продать горячим: порции предложения, которые движок
        просит продать до срока, покрывают часть партии), `discount` (остаток покрывают порции витрины
        «Спаси продукты»; цена ступени — скидка на эти порции), `prep` (заготовка — пока без расчёта, `status=roadmap`) и
        `transfer` (передача в соседнюю точку — считает хаб, `status=network`). `net_minor` = сохранённая
        себестоимость минус цена ступени; `best` — расчётная ступень с наибольшим `net_minor` > 0, `combined_minor` —
        итог «сначала продать, остаток со скидкой». Партии по убыванию денег под риском. Только чтение; блюда на паузе,
        скрытые менеджером и в стоп-листе не участвуют. Без цены продукта деньги не считаются (`status=no_price`).
      responses:
        '200':
          description: Партии со ступенями; пустой массив, если спасать нечего
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/LadderBatch'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/analytics/forecast-accuracy:
    get:
      tags: [analytics]
      summary: Точность прогноза спроса — насколько движок угадывал прошедшие сутки (viewer)
      description: |
        Для каждых из последних `days` суток берётся λ, какой её посчитал бы движок на начало суток (только заказы
        до этого момента, окно N и априор n0 — те же, что у горячих предложений), и сравнивается с фактом суток.
        `wape_pct` = Σ|прогноз − факт| / Σ факт × 100; `baseline_wape_pct` — то же для прогноза «только априор»
        без обучения. Сутки с прыжком времени стенда и сутки до начала истории пропускаются. Отклонённый заказ входит
        в факт не больше чем `RejectedCap` порциями (как в оценке спроса). `enough_data=false`, если дней с
        историей меньше 3 или фактического спроса нет: проценты тогда 0. Ничего не пишется.
      parameters:
        - {name: days, in: query, description: "Сколько прошедших суток проверять, 1…30, по умолчанию 7", schema: {type: integer, minimum: 1, maximum: 30, default: 7}}
      responses:
        '200':
          description: Точность по всему меню и по блюдам (с наибольшей ошибкой сверху)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForecastAccuracy'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/supplier-codes:
    get:
      tags: [menu]
      summary: Сопоставление кодов поставщика с продуктами (viewer)
      description: |
        Код поставщика (GTIN из маркировки или артикул) → продукт справочника. Общее для всех устройств приёмки:
        раньше сопоставление жило в localStorage одного устройства. Новые первыми.
      responses:
        '200':
          description: Список сопоставлений
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SupplierCode'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/supplier-codes/{code}:
    parameters:
      - {name: code, in: path, required: true, schema: {type: string, pattern: '^[0-9A-Za-z._-]{1,64}$'}}
    put:
      tags: [menu]
      summary: Сопоставить код поставщика с продуктом (operator)
      description: Один код — один продукт; повтор идемпотентен, прежний продукт заменяется. Продукт удалён из справочника — запись уходит вместе с ним; сброс стенда очищает справочник.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              additionalProperties: false
              properties:
                product_id: {type: string}
      responses:
        '200':
          description: Сопоставление записано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupplierCode'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: "`unknown_product` — продукта нет в справочнике", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [menu]
      summary: Снять сопоставление (operator; повтор тоже 204)
      responses:
        '204': {description: Снято}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/dish-holds:
    get:
      tags: [menu]
      summary: Блюда на ручной паузе (viewer)
      responses:
        '200':
          description: Новые первыми
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DishHold'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/dish-holds/{dish_id}:
    parameters:
      - {name: dish_id, in: path, required: true, schema: {type: string}}
    put:
      tags: [menu]
      summary: Поставить блюдо на ручную паузу (operator)
      description: |
        Менеджер или повар снимает блюдо с продажи, пока не снимет паузу. Заказ с таким блюдом отклоняется целиком
        (`409 dish_on_hold`, склад не меняется, отказ сохраняется). Автоматический стоп-лист по остаткам не меняется:
        `GET /api/stop-list` и `available` в `GET /api/dishes` считаются только по остаткам. Продажа из кассы
        (`source=pos`) паузой не отклоняется. Повтор идемпотентен, заметка заменяется. Открытые экраны получают
        `stoplist.changed` (`added` и `removed` пусты, `reason=manual_hold`). `POST /api/demo/reset` снимает все паузы.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: {type: string, maxLength: 200, description: "Причина, например «сломана плита»"}
      responses:
        '200':
          description: Пауза записана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DishHold'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: "`unknown_dish` — блюда нет в справочнике", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [menu]
      summary: Снять паузу (operator)
      responses:
        '204': {description: Пауза снята; повтор тоже 204}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/hot-offers/overrides:
    get:
      tags: [menu]
      summary: Решения менеджера по горячим предложениям — закреплённые и скрытые блюда (viewer)
      responses:
        '200':
          description: Новые первыми
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/HotOverride'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/hot-offers/overrides/{dish_id}:
    parameters:
      - {name: dish_id, in: path, required: true, schema: {type: string}}
    put:
      tags: [menu]
      summary: Закрепить блюдо в горячих предложениях или скрыть его (operator)
      description: |
        `pin` — блюдо показывается менеджеру и официанту: если расчёт его и так предлагает — с пометкой `pinned`,
        иначе — в `manager_picks` ответа `GET /api/hot-offers` (у таких блюд нет партии-причины, поэтому они не в `offers`).
        Закреплённое блюдо из стоп-листа не предлагается — оно в `excluded` с причиной. `hide` — блюдо убирается из `offers`.
        Повтор идемпотентен, новое решение заменяет прежнее. Открытые экраны получают `hotoffers.changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              additionalProperties: false
              properties:
                mode: {type: string, enum: [pin, hide]}
                note: {type: string, maxLength: 200, description: "Подсказка для зала, например «предлагать к обеду»"}
      responses:
        '200':
          description: Решение записано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HotOverride'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: "`unknown_dish` — блюда нет в справочнике", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [menu]
      summary: Снять решение — блюдо снова только под расчётом (operator)
      responses:
        '204': {description: Снято (или решения не было)}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/orders:
    post:
      tags: [orders]
      summary: Создать заказ (operator)
      description: |
        `id` — UUID от клиента. `source`: `api` (по умолчанию; всё или ничего) или `pos` (продажа из кассы:
        недостача пишется в `shortfalls`, отказа нет). Повтор с тем же id и телом — `200`/`409` с `replayed=true`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderRequest'}
            example:
              id: 5b0c0c3e-8a51-4d0e-9d0b-1f2a3b4c5d6e
              items: [{dish_id: salmon-pasta, portions: 2}]
      responses:
        '201':
          description: Принят
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
              example:
                id: 5b0c0c3e-8a51-4d0e-9d0b-1f2a3b4c5d6e
                source: api
                status: accepted
                at: '2026-10-09T12:00:00+03:00'
                replayed: false
                writeoffs: [{product_id: salmon, batch_id: 17, qty: {qty: 300, unit: g}, expires_at: '2026-10-12T09:00:00+03:00'}]
                shortfalls: []
        '200':
          description: Повтор принятого заказа (`replayed=true`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResponse'}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: |
            `insufficient_stock` (в `details` — `order_id`, `status=rejected`, `at`, `missing`), `dish_on_hold`
            (блюдо на ручной паузе: в `details` — `order_id`, `status=rejected`, `at`, `dishes` с `dish_id` и `note`;
            остатки не меняются) или `order_conflict` (тот же id, другое тело).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: insufficient_stock
                  message: недостаточно продуктов
                  details:
                    order_id: 5b0c0c3e-8a51-4d0e-9d0b-1f2a3b4c5d6e
                    status: rejected
                    at: '2026-10-09T12:00:00+03:00'
                    missing:
                      - {product_id: cream, product_name: Сливки, required: {qty: 400, unit: ml},
                         available: {qty: 100, unit: ml}, missing: {qty: 300, unit: ml}}
    get:
      tags: [orders]
      summary: История заказов (viewer)
      description: |
        Новые сверху. `X-Total-Count` — число заказов с этим статусом целиком (не размер страницы).
        Следующая страница — `before=<id последнего заказа страницы>`.
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [accepted, rejected]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: before, in: query, description: id заказа, после которого продолжить, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Список
          headers:
            X-Total-Count: {description: Число заказов с этим статусом, schema: {type: integer}}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/OrderResponse'}}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/orders/{id}/cancel:
    post:
      tags: [orders]
      summary: Отменить принятый заказ, вернув проданное в партии (operator)
      parameters:
        - {name: id, in: path, required: true, description: Отменяемый заказ, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties: {id: {type: string, minLength: 1, maxLength: 128, description: id операции (идемпотентность)}}
            example: {id: cancel-001}
      responses:
        '201':
          description: Отменён
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  order_id: {type: string}
                  returned: {type: array, items: {$ref: '#/components/schemas/CorrectionLine'}}
                  expired: {type: array, items: {$ref: '#/components/schemas/CorrectionLine'}}
                  at: {type: string, format: date-time}
                  replayed: {type: boolean}
        '200': {description: Повтор операции (`replayed=true`)}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: "`order_not_cancellable`, `already_cancelled` или `correction_conflict`"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/writeoffs:
    post:
      tags: [orders]
      summary: Списать брак с партии (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, batch_id, qty, reason]
              properties:
                id: {type: string, minLength: 1, maxLength: 128}
                batch_id: {type: integer}
                qty: {$ref: '#/components/schemas/QtyInput'}
                unit: {$ref: '#/components/schemas/Unit'}
                reason: {type: string, enum: [spoilage, damage]}
            example: {id: wo-001, batch_id: 17, qty: '1.5', unit: kg, reason: spoilage}
      responses:
        '201':
          description: Списано
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  batch_id: {type: integer}
                  product_id: {type: string}
                  qty: {$ref: '#/components/schemas/Qty'}
                  reason: {type: string}
                  remaining: {$ref: '#/components/schemas/Qty'}
                  at: {type: string, format: date-time}
                  replayed: {type: boolean}
        '200': {description: Повтор операции (`replayed=true`)}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: "`insufficient_batch` (qty больше остатка партии) или `correction_conflict`"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/inventory:
    post:
      tags: [orders]
      summary: Инвентаризация продукта (operator)
      description: Недостача списывается по FEFO движениями `adjustment`; излишек — новая партия `INV-<id>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, product_id, counted]
              properties:
                id: {type: string, minLength: 1, maxLength: 128}
                product_id: {type: string}
                counted: {$ref: '#/components/schemas/QtyInput'}
                unit: {$ref: '#/components/schemas/Unit'}
            example: {id: inv-001, product_id: salmon, counted: '2.5', unit: kg}
      responses:
        '201':
          description: Применена
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  product_id: {type: string}
                  counted: {$ref: '#/components/schemas/Qty'}
                  shortage: {type: array, items: {$ref: '#/components/schemas/CorrectionLine'}}
                  surplus: {type: [object, 'null'], additionalProperties: true}
                  at: {type: string, format: date-time}
                  replayed: {type: boolean}
        '200': {description: Повтор операции (`replayed=true`)}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: "`correction_conflict` — тот же id, другое тело"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/catalog:
    put:
      tags: [integration]
      summary: Импорт справочников из учётной системы (admin или ключ operator)
      description: |
        Добавление и обновление без удаления; `recipe` блюда заменяется целиком; одна транзакция.
        Вошедший по паролю `operator` получает `403`.
      parameters:
        - {name: dry_run, in: query, description: Вернуть разницу, ничего не записав, schema: {type: boolean}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogRequest'}
            example:
              products:
                - {id: rice, name: Рис, unit: g, price_minor_per_1000: 15000, lead_days: 2, pack_size: 1000, shelf_life_hours: 720}
              dishes:
                - id: pilaf
                  name: Плов
                  price_minor: 45000
                  prior_daily: 12.5
                  recipe: [{product_id: rice, quantity: '0.15', unit: kg}]
      responses:
        '200':
          description: Результат импорта
          content:
            application/json:
              schema:
                type: object
                properties:
                  dry_run: {type: boolean}
                  products:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogAction'}
                  dishes:
                    type: array
                    items: {$ref: '#/components/schemas/CatalogAction'}
              example:
                dry_run: true
                products: [{id: rice, action: created}]
                dishes: [{id: pilaf, action: updated, fields: [price_minor, recipe]}]
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: "`unit_conflict` — у существующего продукта другая единица (`details.product_id`, `current_unit`, `import_unit`)"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/outbox:
    get:
      tags: [integration]
      summary: Недоставленные сообщения для адаптера, по возрастанию id (operator)
      parameters:
        - {name: after, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer}
                    kind: {type: string}
                    payload: {}
                    created_at: {type: string, format: date-time}
                    attempts: {type: integer}
                    last_error: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/outbox/{id}/ack:
    post:
      tags: [integration]
      summary: Подтвердить доставку или ошибку сообщения (operator)
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              properties:
                ok: {type: boolean}
