      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [running]
              properties: {running: {type: boolean}}
            example: {running: true}
      responses:
        '200': {description: Применено}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/demo/burst:
    post:
      tags: [demo]
      summary: Параллельные заказы по одной порции блюда (DEMO_TOKEN)
      description: "Требует `Authorization: Bearer <DEMO_TOKEN>`."
      security: [{demoToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dish_id, orders]
              properties:
                dish_id: {type: string}
                orders: {type: integer, minimum: 1, maximum: 50}
            example: {dish_id: salmon-pasta, orders: 10}
      responses:
        '200': {description: Результат серии}
        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/auth/login:
    post:
      tags: [access]
      summary: Вход по логину и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties: {login: {type: string}, password: {type: string}}
            example: {login: admin, password: s3cret}
      responses:
        '200':
          description: Вход выполнен; cookie `session` (HttpOnly, SameSite=Strict, Secure)
          content:
            application/json:
              schema:
                type: object
                properties: {login: {type: string}, role: {$ref: '#/components/schemas/Role'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429':
          description: "`too_many_attempts` — больше 5 неудач на login за 15 минут"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/auth/telegram:
    post:
      tags: [access]
      summary: Вход в mini-app по Telegram initData
      description: |
        Публичный маршрут; есть только при заданном `TELEGRAM_BOT_TOKEN`. Подпись `init_data`
        проверяется по документации Telegram (HMAC-SHA256, сравнение за постоянное время),
        `auth_date` не старше 24 ч по часам API. Успех — та же cookie `session`, что у `/api/auth/login`,
        и ответ как у `GET /api/auth/me`. При `AUTH_REQUIRED=false` подпись проверяется,
        но ответ — гость-оператор (`login: null`), cookie не выдаётся. Подробности — docs/telegram-miniapp.md.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties: {init_data: {type: string, description: "Telegram.WebApp.initData как есть"}}
      responses:
        '200':
          description: Вход выполнен
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: {type: [string, 'null']}
                  role: {$ref: '#/components/schemas/Role'}
                  auth_required: {type: boolean}
        '400': {$ref: '#/components/responses/Validation'}
        '401':
          description: Подпись неверна или `auth_date` старше 24 ч
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: "`telegram_not_linked` — аккаунт не привязан; `details.telegram_user_id` — id для привязки админом"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/auth/telegram-link-code:
    post:
      tags: [access]
      summary: Одноразовый код привязки Telegram к своему аккаунту (веб-сессия, любая роль)
      description: |
        Только для вошедшего в веб: ключи доступа и режим без входа получают 403. Код — 8 знаков без похожих
        (I, L, O, 0, 1), живёт 10 минут, одноразовый; новый вызов отзывает прежний код этого пользователя. В журнале
        аудита только факт выдачи, не сам код; хранится хеш. Есть, только когда включён вход через Telegram.
      responses:
        '200':
          description: Код и срок
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: string, example: ABCD-EFGH}
                  expires_in_seconds: {type: integer, example: 600}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/auth/telegram-link:
    get:
      tags: [access]
      summary: Привязан ли мой аккаунт к Telegram (веб-сессия)
      responses:
        '200':
          description: Состояние привязки
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      tags: [access]
      summary: Снять свою привязку Telegram (веб-сессия; повтор тоже 204)
      responses:
        '204': {description: Привязка снята}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [access]
      summary: Привязать Telegram по коду из веба и войти в mini-app (публичный)
      description: |
        Подпись `init_data` доказывает, какой Telegram-аккаунт пишет, код из «Аккаунта» — какой логин веба он
        привязывает. Успех: привязка, cookie `session`, роль как в вебе; код сгорает только здесь. Неверный,
        просроченный и использованный код — одинаковый `400 invalid_link_code` (по причине код не угадать). Неверная
        подпись — `401`, код не сгорает и попытка не считается. 5 неудачных попыток с адреса за 10 минут — `429`.
        Аккаунт Telegram уже привязан к другому пользователю — `409`. При `AUTH_REQUIRED=false` — `409`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data, code]
              properties:
                init_data: {type: string, description: "Telegram.WebApp.initData как есть"}
                code: {type: string, description: "Код из «Аккаунта», регистр и дефис не важны", example: ABCD-EFGH}
      responses:
        '200':
          description: Привязано, сессия выдана
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: {type: string}
                  role: {$ref: '#/components/schemas/Role'}
                  auth_required: {type: boolean}
        '400':
          description: "`invalid_link_code` — код неверен, просрочен или уже использован; либо ошибка валидации"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {description: Подпись init_data неверна или устарела, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Telegram-аккаунт уже привязан к другому пользователю или вход не включён, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: Слишком много неверных кодов, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/auth/logout:
    post:
      tags: [access]
      summary: Выход (viewer)
      responses:
        '204': {description: Сессия удалена}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/auth/me:
    get:
      tags: [access]
      summary: Текущий пользователь (viewer)
      responses:
        '200':
          description: При `AUTH_REQUIRED=false` без учётных данных — `login=null`, `role=operator`
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: {type: [string, 'null']}
                  role: {$ref: '#/components/schemas/Role'}
                  auth_required: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/auth/password:
    post:
      tags: [access]
      summary: Сменить свой пароль (viewer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
