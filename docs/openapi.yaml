        '400': {$ref: '#/components/responses/Validation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Часы не ускоренные
          content:
            application/json:
