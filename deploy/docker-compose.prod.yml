# Прод-стенд (VPS 1 vCPU / 2 ГБ). Запуск: deploy/scripts/deploy.sh <tag>.
# Наружу открыты только 80 и 443 caddy. Не пересекается с чужим контейнером postgres на сервере.
name: swapowl

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    mem_limit: ${CADDY_MEM:-128m}
    restart: unless-stopped
    logging: *logging

  web:
    image: ${IMAGE_REPO:-ghcr.io/immxrtalbeast/umirhack-2026}/web:${IMAGE_TAG:-latest}
    mem_limit: ${WEB_MEM:-64m}
    restart: unless-stopped
    logging: *logging

  api:
    image: ${IMAGE_REPO:-ghcr.io/immxrtalbeast/umirhack-2026}/api:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-umirhack}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-umirhack}?sslmode=disable
      PORT: "8080"
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      RESTAURANT_TZ: ${RESTAURANT_TZ:-Europe/Moscow}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      CLOCK_MODE: ${CLOCK_MODE:-real}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_TOKEN: ${DEMO_TOKEN:-}
      SEED_ON_EMPTY: ${SEED_ON_EMPTY:-true}
      LATE_EVENTS_HOURS: ${LATE_EVENTS_HOURS:-2}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: ${API_MEM:-256m}
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umirhack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-umirhack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: ${PG_MEM:-512m}
    restart: unless-stopped
    logging: *logging

  # Профиль integrations: fake-iiko, iiko-adapter, notifier. По умолчанию демо-стенд — caddy, web, api, postgres:
  # адаптер заливает в БД справочники и продажи эмулятора с реальными часами и портит демо-сид.
  # Включение: COMPOSE_PROFILES=integrations в .env точки (docs/operations.md).
  fake-iiko:
    profiles: ["integrations"]
    image: ${IMAGE_REPO:-ghcr.io/immxrtalbeast/umirhack-2026}/iiko-adapter:${IMAGE_TAG:-latest}
    entrypoint: ["/usr/local/bin/fake-iiko"]
    command: ["-addr", ":8081"]
    environment:
      FAKE_IIKO_LOGIN: ${IIKO_LOGIN:-demo}
      FAKE_IIKO_PASSWORD: ${IIKO_PASSWORD:-}
    mem_limit: ${SIDECAR_MEM:-64m}
    restart: unless-stopped
    logging: *logging

  iiko-adapter:
    profiles: ["integrations"]
    image: ${IMAGE_REPO:-ghcr.io/immxrtalbeast/umirhack-2026}/iiko-adapter:${IMAGE_TAG:-latest}
    depends_on:
      - api
      - fake-iiko
    environment:
      IIKO_URL: http://fake-iiko:8081
      IIKO_LOGIN: ${IIKO_LOGIN:-demo}
      IIKO_PASSWORD: ${IIKO_PASSWORD:-}
      API_URL: http://api:8080
      API_KEY: ${ADAPTER_API_KEY:-}
      ADAPTER_MODE: ${ADAPTER_MODE:-shadow}
      ADAPTER_STATE_FILE: /data/iiko-adapter-state.json
      ADAPTER_SHADOW_FILE: /data/iiko-adapter-shadow.json
    volumes:
      - adapter_data:/data
    mem_limit: ${SIDECAR_MEM:-64m}
    restart: unless-stopped
    logging: *logging

  notifier:
    profiles: ["integrations"]
    image: ${IMAGE_REPO:-ghcr.io/immxrtalbeast/umirhack-2026}/notifier:${IMAGE_TAG:-latest}
    depends_on:
      - api
    environment:
      API_URL: http://api:8080
      API_KEY: ${NOTIFIER_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    mem_limit: ${SIDECAR_MEM:-64m}
    restart: unless-stopped
    logging: *logging

  # --- Общие сервисы (профили; в одиночном режиме не стартуют). Режим сети — docs/operations.md, «Много точек». ---

  # Профиль ops: сторож (FS-117). В одиночном режиме: --profile ops; на много точек fleet.sh ставит свой на каждую.
  watchdog:
    profiles: ["ops"]
    image: ${IMAGE_REPO:-ghcr.io/immxrtalbeast/umirhack-2026}/watchdog:${IMAGE_TAG:-latest}
    depends_on:
      - api
    environment:
      WATCHDOG_API_URL: http://api:8080
      WATCHDOG_ADAPTER_URL: ${WATCHDOG_ADAPTER_URL:-}
      WATCHDOG_METRICS_TOKEN: ${METRICS_TOKEN:-}
      WATCHDOG_TG_TOKEN: ${WATCHDOG_TG_TOKEN:-}
      WATCHDOG_TG_CHAT: ${WATCHDOG_TG_CHAT:-}
      WATCHDOG_EVERY: ${WATCHDOG_EVERY:-30s}
      WATCHDOG_SYNC_MAX: ${WATCHDOG_SYNC_MAX:-15m}
      WATCHDOG_OUTBOX_MAX: ${WATCHDOG_OUTBOX_MAX:-10m}
      WATCHDOG_REPEAT: ${WATCHDOG_REPEAT:-1h}
      WATCHDOG_DATA_DIR: ${WATCHDOG_DATA_DIR:-}
    mem_limit: 32m
    restart: unless-stopped
    logging: *logging

  # Профиль fleet (проект swapowl-edge): hub опрашивает точки по сети edge. Конфиг генерирует fleet.sh.
  hub:
    profiles: ["fleet"]
    image: ${IMAGE_REPO:-ghcr.io/immxrtalbeast/umirhack-2026}/hub:${IMAGE_TAG:-latest}
    environment:
      HUB_CONFIG: /etc/hub/hub.yml
      HUB_TOKEN: ${HUB_TOKEN:-}
      HUB_POLL: ${HUB_POLL:-60s}
    volumes:
      - ${EDGE_DIR:-./edge}/hub.yml:/etc/hub/hub.yml:ro
    networks: [edge]
    mem_limit: 32m
    restart: unless-stopped
    logging: *logging

  # Профиль fleet: один Caddy на сервер, маршрут <slug>.<SITE_DOMAIN> на каждую точку (Caddyfile генерирует fleet.sh).
  edge:
    profiles: ["fleet"]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ${EDGE_DIR:-./edge}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    mem_limit: ${CADDY_MEM:-128m}
    restart: unless-stopped
    logging: *logging

networks:
  # Общая сеть сервера: точки подключают к ней api и web (алиасы api-<slug>, web-<slug>), edge и hub живут в ней.
  # Создаёт fleet.sh; в одиночном режиме не используется.
  edge:
    name: swapowl-edge
    external: true

volumes:
  pgdata:
  adapter_data:
  caddy_data:
  caddy_config:
