# Развёртывание: сборка образов в GHCR и выкатка по SSH.
# Автоматически — после зелёного CI на push в main; вручную (workflow_dispatch) с входом tag — откат на любой тег.
# Секреты (людям): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег образов для выкатки или отката (sha коммита)
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/immxrtalbeast/umirhack-2026

jobs:
  build:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: deploy/Dockerfile.api }
          - { name: web, dockerfile: deploy/Dockerfile.web }
          - { name: iiko-adapter, dockerfile: deploy/Dockerfile.adapter }
          - { name: notifier, dockerfile: deploy/Dockerfile.notifier }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: [build]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Определить тег
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="${INPUT_TAG:-$RUN_SHA}"
          [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "недопустимый тег"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Настроить SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Выложить deploy/ и запустить deploy.sh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ steps.tag.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh_opts=(-i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes)
          tar -C . -czf - deploy | ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/swapowl && tar -C /opt/swapowl -xzf -'
          # Токен GITHUB_TOKEN живёт только этот запуск; пакеты можно сделать публичными и убрать вход.
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod +x /opt/swapowl/deploy/scripts/*.sh && /opt/swapowl/deploy/scripts/deploy.sh '$TAG'"
